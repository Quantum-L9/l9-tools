# --- L9_META ---
# l9_schema: 1
# origin: l9-tools
# layer: [build-config]
# tags: [python, packaging, cli]
# owner: platform
# status: active
# --- /L9_META ---

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "l9-tools"
version = "0.1.0"
description = "Shared L9 contract compiler, routing, retrieval adapters, CLI, and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unknown" }
authors = [{ name = "Quantum-L9" }]
dependencies = []

[project.scripts]
l9-contract = "l9_tools.cli:main"
l9-tools-mcp = "l9_tools.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/l9_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
